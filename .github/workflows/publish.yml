# Publish dsh-ths-holdings to npm (and attach the tarball to a GitHub Release).
#
# One-time setup (repo owner):
#   1. npmjs.com → Access Tokens → generate an "Automation" token
#      (automation tokens bypass 2FA prompts during CI).
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret: NPM_TOKEN = the token from step 1.
#   3. Optional: Settings → Environments → npm-publish → add required
#      reviewers so publication needs a human approval (recommended).
#
# Trigger a release:
#   npm version patch         # bump 0.1.6 -> 0.1.7, commits + tags v0.1.7
#   git push && git push --tags
# or run this workflow manually with the "publish" checkbox (from a v* tag).
#
# Design (modeled on deepseek-harness' release.yml pattern):
#   - pack runs WITHOUT registry credentials on every run — builds, verifies the
#     tag/version match, and uploads the exact tarball bytes;
#   - publish consumes the packed bytes (never a rebuild) and is the ONLY step
#     that can write to the npm registry; it requires a v* tag push or the
#     manual "publish" flag;
#   - publish runs are serialized so two versions cannot race dist-tags.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (must run from a v* tag). Leave unchecked for a dry-run pack.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write        # create the GitHub Release
  id-token: write        # npm provenance (sigstore OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '22'

jobs:
  pack:
    name: Build and pack tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        # Fresh runners enable pnpm's supply-chain release-age policy by
        # default (minimumReleaseAge = 24h), which rejects yesterday's
        # @deepseek-ai 0.1.1-rc.2 publishes with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
        # Bypass it for this run only; the lockfile's integrity is still checked.
        env:
          npm_config_minimum_release_age: '0'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify release version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          echo "package.json version: $pkg_version"
          # On a tag push, the tag must match package.json (v0.1.7 == 0.1.7).
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$pkg_version" ]]; then
              echo "::error::tag v$tag_version does not match package.json version $pkg_version" >&2
              exit 1
            fi
          fi
          echo "PKG_VERSION=$pkg_version" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack --pack-destination dist

      - name: Show tarball contents
        run: tar -tzf dist/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: github.event_name == 'push' || inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write    # npm provenance
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - name: Publish tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/*.tgz --provenance --access public

  release:
    name: GitHub Release with tarball
    if: github.event_name == 'push'   # v* tag pushes only
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true